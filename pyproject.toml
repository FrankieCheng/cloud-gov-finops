[project]
name = "cloud-gov-finops"
version = "0.1.0"
description = "Google Cloud Governance (MSA & Project/Org Quotas) + FinOps Billing Anomaly Feishu Bot"
authors = [
    {name = "Cloud Ops Team", email = "noreply@example.com"},
]
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0,<3.0.0",
    "google-genai>=1.0.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "pydantic>=2.0.0,<3.0.0",
    "lark-oapi>=1.7.3",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa", "quota", "billing", "bot"]
